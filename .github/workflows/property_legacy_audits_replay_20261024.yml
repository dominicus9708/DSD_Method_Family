name: Property 2026-10-24 Historical Audit Scripts Replay
on:
  push:
    paths:
      - '.github/workflows/property_legacy_audits_replay_20261024.yml'
  workflow_dispatch:
jobs:
  exact-scripts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Preserve P9A/P10/P11/P12 original Python blobs
        shell: bash
        run: |
          set -euo pipefail
          ROOT=DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/scripts
          test "$(git hash-object "$ROOT/verify_p9a_finite_morphisms.py")" = "c04eb5ae30a8088ec7baf23aa1926a6d03a0b34a"
          test "$(git hash-object "$ROOT/verify_p10_cross_sort.py")" = "64d1b6027ab97cdfb4be264f2ac2f9e27c6b1500"
          test "$(git hash-object "$ROOT/verify_p11_empty_dependency_edges.py")" = "4c988d4dfc3b78aa3b2c2249e07ea8669f85d102"
          test "$(git hash-object "$ROOT/verify_p12_representation_aggregate.py")" = "146e3e6fe88c3b397b9f26f563ac368b6d9c8178"
          echo "All four original P9A-P12 Python blobs unchanged"
      - name: Reexecute four original audit suites and compare committed JSON
        shell: bash
        run: |
          set -euo pipefail
          ROOT=DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01
          for ID in p9a p10 p11 p12; do
            case "$ID" in
              p9a) S=verify_p9a_finite_morphisms.py; O=p9a_finite_morphisms.json ;;
              p10) S=verify_p10_cross_sort.py; O=p10_cross_sort_ci.json ;;
              p11) S=verify_p11_empty_dependency_edges.py; O=p11_empty_dependency_edges.json ;;
              p12) S=verify_p12_representation_aggregate.py; O=p12_representation_aggregate.json ;;
            esac
            python -W error -m py_compile "$ROOT/scripts/$S"
            python -W error "$ROOT/scripts/$S" "$RUNNER_TEMP/$O"
            python -c 'import json,sys; a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]));assert a==b,(sys.argv[1],sys.argv[2]);print("ARCHIVE MATCH",sys.argv[2])' "$RUNNER_TEMP/$O" "$ROOT/results/$O"
            sha256sum "$ROOT/scripts/$S" "$RUNNER_TEMP/$O"
          done
      - name: Independent cross-suite evidence and invariants
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          a=json.loads((p/'p9a_finite_morphisms.json').read_text())
          b=json.loads((p/'p10_cross_sort_ci.json').read_text())
          c=json.loads((p/'p11_empty_dependency_edges.json').read_text())
          d=json.loads((p/'p12_representation_aggregate.json').read_text())
          expected="03a7e5693b73f0332e71a5eb83483e4f3539fc940d5368d5eec1523867e3d79c"
          assert all(expected==x[k] for x,k in ((a,"source_pdf_sha256"),(b,"locked_pdf_sha256"),(c,"source_sha256"),(d,"source_pdf_sha256")))
          assert a['legal_cores']==53 and a['counts']['pairs']==2809
          assert sum(a['counts']['branch_counts'].values())+a['counts']['strict']==2809
          assert b['models']==108 and b['ordered_pairs']==11664
          assert sum(b['first_branch_pair_counts'].values())+b['map_counts']['strict']==11664
          assert b['map_counts']['candidate']>=b['map_counts']['forward']>=b['map_counts']['embedding']>=b['map_counts']['strict']
          assert c['tested_edge_cases']==10 and c['all_pass'] and all(c['checks'].values())
          assert d['cases']==14 and all(d['checks'].values())
          assert all(x.get('FPA',x.get('full_FPA','OPEN'))=="OPEN" for x in (b,c,d))
          print('P9A-P12 independent cross-suite constraints PASS')
          PY
