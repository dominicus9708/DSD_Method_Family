name: Property P52 A-core LaTeX compile

on:
  push:
    paths:
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P52_independent_proof_scope_and_build/**'
      - '.github/workflows/property_fpa_p52_latex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live for reproducible manuscript build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Compile P52 working manuscript
        working-directory: 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P52_independent_proof_scope_and_build'
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error 'DSD_Property_Axiom_System_EN_P52_A_WORKING.tex'
          test -s 'DSD_Property_Axiom_System_EN_P52_A_WORKING.pdf'

      - name: Check unresolved bibliography references and citations
        working-directory: 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P52_independent_proof_scope_and_build'
        run: |
          if grep -Eiq 'LaTeX Warning: There were undefined references|LaTeX Warning: Citation .* undefined|LaTeX Warning: Reference .* undefined' DSD_Property_Axiom_System_EN_P52_A_WORKING.log; then
            echo 'Unresolved references/citations detected in P52 manuscript'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P52-A-core-manuscript-build-evidence
          path: |
            DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P52_independent_proof_scope_and_build/DSD_Property_Axiom_System_EN_P52_A_WORKING.pdf
            DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P52_independent_proof_scope_and_build/DSD_Property_Axiom_System_EN_P52_A_WORKING.log
          if-no-files-found: ignore
          retention-days: 30
