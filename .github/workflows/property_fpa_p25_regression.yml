name: Property P25 Integrated Manuscript Audit Regression
on:
  push:
    paths:
      - '.github/workflows/property_fpa_p25_regression.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          ROOT=DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01
          python -W error "$ROOT/scripts/verify_p20_full_c1_inverse.py" "$RUNNER_TEMP/p20_full_c1_inverse.json"
          python -W error "$ROOT/scripts/verify_p22_stagevi_bridge_regression.py" "$RUNNER_TEMP/p22_stagevi_regression.json"
          python -W error "$ROOT/scripts/verify_p23_typed_stagevi_adapter.py" "$RUNNER_TEMP/p23_typed_stagevi_adapter.json"
          python -W error "$ROOT/scripts/verify_p24_paper_change_countermodels.py" "$RUNNER_TEMP/p24_paper_change_countermodels.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); r=pathlib.Path("DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/results"); names=["p20_full_c1_inverse","p22_stagevi_regression","p23_typed_stagevi_adapter","p24_paper_change_countermodels"];assert all(json.loads((p/(n+".json")).read_text())==json.loads((r/(n+".json")).read_text()) for n in names);print("P25 ARCHIVED P20/P22/P23/P24 ALL FOUR FULL JSON EXACT")'
