name: Property P46 shared and branching theorems
on:
  push:
    paths:
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P46_choice_invariants_branching/**'
      - '.github/workflows/property_fpa_p46.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify P27 frozen source and P46 branch monotonicity fixtures
        run: python DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P46_choice_invariants_branching/verify_p46_branch_monotonicity.py
