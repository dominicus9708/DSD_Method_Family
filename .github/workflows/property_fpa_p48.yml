name: Property P48 method role semantic adequacy
on:
  push:
    paths:
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P48_method_role_semantic_adequacy/**'
      - '.github/workflows/property_fpa_p48.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify P48 frozen sources role matrix and observation countermodels
        run: python DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P48_method_role_semantic_adequacy/verify_p48_method_role_adequacy.py
