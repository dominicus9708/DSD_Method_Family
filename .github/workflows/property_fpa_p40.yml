name: Property P40 20 proof-claims audit
on:
  push:
    paths:
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P40_20_statement_proof_audit/**'
      - '.github/workflows/property_fpa_p40.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Audit frozen P27 claims and finite countermodels
        run: python DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P40_20_statement_proof_audit/verify_p40_20_proof_claims.py
