name: Property P47 predecision exit and typed raw negative controls
on:
  push:
    paths:
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P47_predecision_exit_and_negative_controls/**'
      - '.github/workflows/property_fpa_p47.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify P47 source audit trace and typed raw negative controls
        run: python DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P47_predecision_exit_and_negative_controls/verify_p47_predecision_exit.py
