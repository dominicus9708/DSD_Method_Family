name: Property P42 20-13 scope ledger regression
on:
  push:
    paths:
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P42_consolidated_premises_countermodels_revision_spec/**'
      - '.github/workflows/property_fpa_p42.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Recheck P27 frozen sources and P42 20/13 audit ledger
        run: python DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/P42_consolidated_premises_countermodels_revision_spec/verify_p42_integrated_claims.py
