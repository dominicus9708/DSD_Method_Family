name: Property FPA P9A Finite Morphism Audit
on:
  push:
    paths:
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/scripts/verify_p9a_finite_morphisms.py'
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/results/p9a_finite_morphisms.json'
      - '.github/workflows/property_fpa_p9a.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and execute exact repository checker
        shell: bash
        run: |
          set -euo pipefail
          ROOT=DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01
          python -W error -m py_compile "$ROOT/scripts/verify_p9a_finite_morphisms.py"
          python -W error "$ROOT/scripts/verify_p9a_finite_morphisms.py" "$RUNNER_TEMP/p9a.json"
          python -c 'import json,sys; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); assert a==b; print("P9A uploaded JSON matches actual run")' "$RUNNER_TEMP/p9a.json" "$ROOT/results/p9a_finite_morphisms.json"
          sha256sum "$ROOT/scripts/verify_p9a_finite_morphisms.py" "$RUNNER_TEMP/p9a.json"
