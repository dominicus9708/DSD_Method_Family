name: Property FPA P11 Typed Boundary Checks
on:
  push:
    paths:
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/scripts/verify_p11_empty_dependency_edges.py'
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/results/p11_empty_dependency_edges.json'
      - '.github/workflows/property_fpa_p11.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile, execute and compare checked edge cases
        shell: bash
        run: |
          set -euo pipefail
          ROOT=DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01
          python -W error -m py_compile "$ROOT/scripts/verify_p11_empty_dependency_edges.py"
          python -W error "$ROOT/scripts/verify_p11_empty_dependency_edges.py" "$RUNNER_TEMP/p11.json"
          python -c 'import json,sys; a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]));assert a==b,(a,b);print("P11 fresh output matches archived JSON")' "$RUNNER_TEMP/p11.json" "$ROOT/results/p11_empty_dependency_edges.json"
          sha256sum "$ROOT/scripts/verify_p11_empty_dependency_edges.py" "$RUNNER_TEMP/p11.json"
