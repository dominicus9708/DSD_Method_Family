name: Property P22 Stage-VI Revision Regression
on:
  push:
    paths:
      - '.github/workflows/property_fpa_p22.yml'
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/scripts/verify_p22_stagevi_bridge_regression.py'
      - 'DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01/results/p22_stagevi_regression.json'
  workflow_dispatch:
jobs:
  p22:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Freeze P20 reference source
        run: |
          ROOT=DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01
          test "$(git hash-object "$ROOT/scripts/verify_p20_full_c1_inverse.py")" = "9fac2c171834f126b9af12d8fedde3e0fbc59b23"
      - name: Run P22 finite model and source-interface controls
        shell: bash
        run: |
          set -euo pipefail
          ROOT=DSD_Audit/audits/formal_proof/property_axiom_system/versions/2026-09-01
          python -W error -m py_compile "$ROOT/scripts/verify_p22_stagevi_bridge_regression.py"
          python -W error "$ROOT/scripts/verify_p22_stagevi_bridge_regression.py" "$RUNNER_TEMP/p22.json"
          python -c 'import json,sys; j=json.load(open(sys.argv[1])); assert len(j["checks"])==j["checks_count"] and all(j["checks"].values());print("P22 check flags verified:",j["checks_count"]);print("REGRESSION: source gaps stay OPEN")' "$RUNNER_TEMP/p22.json"
          python -c 'import json,sys;a=json.load(open(sys.argv[1]));b=json.load(open(sys.argv[2]));assert a==b;print("P22 ARCHIVED DETAILED JSON EXACT MATCH")' "$RUNNER_TEMP/p22.json" "$ROOT/results/p22_stagevi_regression.json"
          cat "$RUNNER_TEMP/p22.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p22-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/p22.json
          retention-days: 30
